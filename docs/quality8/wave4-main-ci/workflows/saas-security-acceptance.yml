name: SaaS security acceptance

on:
  push:
    branches: ['feature/saas-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install verified Sites dependencies
        working-directory: sites
        run: npm run install:ci
      - name: Exercise synthetic authorization, isolation and recovery boundaries
        run: node scripts/run-saas-security-acceptance.mjs "$RUNNER_TEMP/saas-security-acceptance"
      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saas-security-${{ github.sha }}
          path: ${{ runner.temp }}/saas-security-acceptance
          if-no-files-found: error
          retention-days: 14
