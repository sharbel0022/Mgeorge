<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mgeorge – lokal layoutkontroll</title>
<style>body{margin:0;padding:20px;background:#eceff3;color:#162332;font:14px system-ui}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}h1{font-size:17px;margin:0 12px 0 0}button{background:white;border:1px solid #6b7280;border-radius:5px;padding:8px 12px;cursor:pointer}button[aria-pressed=true]{background:#162332;color:white}output{font-variant-numeric:tabular-nums}#stage{position:relative}iframe{display:block;border:0;background:white;transform-origin:top left;box-shadow:0 0 0 1px #475569}</style></head>
<body><header><h1>Lokal layoutkontroll</h1><div aria-label="Välj vybredd"><button data-width="320" aria-pressed="true">320 px</button> <button data-width="390" aria-pressed="false">390 px</button> <button data-width="768" aria-pressed="false">768 px</button> <button data-width="1024" aria-pressed="false">1024 px</button> <button data-width="1440" aria-pressed="false">1440 px</button></div><output id="readout" aria-live="polite"></output><button id="measure">Kontrollera layout</button><output id="metrics" aria-live="polite"></output></header><div id="stage"><iframe id="app" title="Mgeorge vid vald vybredd" src="/" width="320" height="900"></iframe></div>
<script>
const frame=document.querySelector('#app'),stage=document.querySelector('#stage'),readout=document.querySelector('#readout');
let selectedWidth=320;
function display(){const scale=Math.min(1,(window.innerWidth-40)/selectedWidth);frame.style.width=selectedWidth+'px';frame.style.height='900px';frame.style.transform='scale('+scale+')';stage.style.width=selectedWidth*scale+'px';stage.style.height=900*scale+'px';readout.textContent=selectedWidth+' CSS-px · visningsskala '+Math.round(scale*100)+' %';for(const button of document.querySelectorAll('[data-width]'))button.setAttribute('aria-pressed',String(Number(button.dataset.width)===selectedWidth));}
for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{selectedWidth=Number(button.dataset.width);display();});
document.querySelector('#measure').addEventListener('click',()=>{try{const doc=frame.contentDocument,root=doc.documentElement,d=doc.querySelector('dialog[open]'),r=d?.getBoundingClientRect(),grid=d?.querySelector('.form-grid');document.querySelector('#metrics').textContent=JSON.stringify({innerWidth:frame.contentWindow.innerWidth,clientWidth:root.clientWidth,scrollWidth:root.scrollWidth,dialog:r?{x:r.x,y:r.y,width:r.width,height:r.height,clientWidth:d.clientWidth,scrollWidth:d.scrollWidth}:null,formColumns:grid?frame.contentWindow.getComputedStyle(grid).gridTemplateColumns:null,dateWidths:[...doc.querySelectorAll('dialog[open] input[type=\"date\"]')].map(x=>x.getBoundingClientRect().width)});}catch{document.querySelector('#metrics').textContent='Mätningen kunde inte läsas';}});window.addEventListener('resize',display);display();
</script></body></html>
