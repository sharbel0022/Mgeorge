name: Apply reviewed payment-control changes
on:
  push:
    branches: [codex/one-click-payment-control]
    paths: ['.ci/one-click.ready']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/one-click-payment-control
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply exact reviewed file changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          # Normalize one transport transcription; hash must still match exact reviewed bytes.
          { cat .ci/one-click.part-a; sed 's#Pzs+fWo9Pnp5#Pzs+fWo9P/np5#g' .ci/one-click.part-b; } | base64 --decode > /tmp/mg-changes.gz
          echo '37abef19f4bb708fdc441cb3e24b9b6438128b4f75423d02b69c33d1796922b8  /tmp/mg-changes.gz' | sha256sum --check -
          python3 - <<'PY'
          import gzip, json, hashlib, pathlib, subprocess
          change = json.loads(gzip.decompress(pathlib.Path('/tmp/mg-changes.gz').read_bytes()))
          assert change['base'] == '637af0aafe86cc76779c4d7c0f61f5927344c1e1'
          subprocess.run(['git','merge-base','--is-ancestor',change['base'],'HEAD'],check=True)
          allowed = {'README.md','docs/ONE-CLICK-PAYMENT-CONTROL.md','public/app.js','public/index.html','public/payment-control.css','public/payment-control.js','src/payment-control.js','src/payment-overview.js','src/server.js','test/bank-api.test.js','test/bank-ui.test.js','test/payment-control-api.test.js','test/payment-control-ui.test.js','test/payment-control.test.js'}
          assert {f['path'] for f in change['files']} == allowed
          writes=[]
          for item in change['files']:
              path=pathlib.Path(item['path'])
              if item['before'] is None:
                  assert not path.exists(), str(path)
                  result=item['content']
              else:
                  old=path.read_bytes()
                  assert hashlib.sha256(old).hexdigest()==item['before'], str(path)+' changed upstream'
                  text=old.decode('utf-8'); end=0; parts=[]
                  for start,stop,value in item['edits']:
                      assert end<=start<=stop<=len(text)
                      parts.extend([text[end:start],value]); end=stop
                  parts.append(text[end:]); result=''.join(parts)
              new=result.encode('utf-8')
              assert hashlib.sha256(new).hexdigest()==item['after'], str(path)+' result mismatch'
              writes.append((path,new))
          for path,new in writes:
              path.parent.mkdir(parents=True,exist_ok=True); path.write_bytes(new)
          print('Verified and applied',len(writes),'reviewed files.')
          PY
          git diff --check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Commit verified implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs/ONE-CLICK-PAYMENT-CONTROL.md public/app.js public/index.html public/payment-control.css public/payment-control.js src/payment-control.js src/payment-overview.js src/server.js test/bank-api.test.js test/bank-ui.test.js test/payment-control-api.test.js test/payment-control-ui.test.js test/payment-control.test.js
          git rm .ci/one-click.part-* .ci/one-click.ready
          git commit -m 'feat: one-click payment control and unified review workspace'
          git push origin HEAD:codex/one-click-payment-control
