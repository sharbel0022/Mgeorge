name: Expand MG source archive
on:
  push:
    branches: [main]
    paths:
      - 'source/archive.ready'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          test -f source/archive.ready
          cat source/part-* | base64 --decode > source/mgeorge-source.tar.xz
          echo "b21bb82893c6518b5497be63a7b6024890c395fb8f43fa3e876278d4f5ac2368  source/mgeorge-source.tar.xz" | sha256sum --check -
          tar -tJf source/mgeorge-source.tar.xz > /tmp/mgeorge-list.txt
          grep -qx './src/server.js' /tmp/mgeorge-list.txt
          grep -qx './public/app.js' /tmp/mgeorge-list.txt
          tar -xJf source/mgeorge-source.tar.xz -C . --no-same-owner
          node --version
          npm run check
          npm test
      - name: Commit expanded source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .env.example .gitignore README.md package.json public src docs test
          if ! git diff --cached --quiet; then
            git commit -m "feat: import tested MG Fakturakoll application sources"
            git push
          fi
