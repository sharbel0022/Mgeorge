name: SaaS security acceptance

on:
  push:
    branches: ['main', 'feature/saas-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-security-${{ github.ref }}
  cancel-in-progress: true

# A PR checkout is GitHub's tested merge commit. Preserve its PR head/base
# separately so a merge-ref receipt cannot be presented as a head-SHA receipt.
env:
  SAAS_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  SAAS_EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  security_acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install verified Sites dependencies
        working-directory: sites
        run: npm run install:ci
      - name: Exercise synthetic authorization, isolation, migrations and recovery boundaries
        run: node scripts/run-saas-security-acceptance.mjs "$RUNNER_TEMP/saas-security-acceptance"
      - name: Require fresh complete security evidence for this checkout
        run: node scripts/verify-saas-release-evidence.mjs security "$RUNNER_TEMP/saas-security-acceptance" "$GITHUB_SHA"
      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saas-security-${{ github.sha }}
          path: ${{ runner.temp }}/saas-security-acceptance
          if-no-files-found: error
          retention-days: 14

  full_synthetic_recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install verified Sites dependencies
        working-directory: sites
        run: npm run install:ci
      - name: Restore and parse representative synthetic original formats
        env:
          NODE_ENV: test
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/saas-recovery-acceptance"
          node --import ./scripts/saas-test-isolation.mjs --experimental-strip-types --test --test-reporter=tap --test-concurrency=1 sites/tests/recovery-format-originals.test.mjs | tee "$RUNNER_TEMP/saas-recovery-acceptance/format-originals.tap"
      - name: Export and restore 430 synthetic originals into a fresh isolated destination
        run: node scripts/run-saas-recovery-acceptance.mjs "$RUNNER_TEMP/saas-recovery-acceptance"
      - name: Require complete recovery provenance and negative controls for this checkout
        run: node scripts/verify-saas-release-evidence.mjs recovery "$RUNNER_TEMP/saas-recovery-acceptance" "$GITHUB_SHA"
      - name: Publish the verified synthetic recovery summary
        run: >-
          node --input-type=module -e
          'import { readFileSync } from "node:fs"; const directory = process.argv[1]; console.log(JSON.stringify({ kind: "synthetic-recovery-evidence", receipt: JSON.parse(readFileSync(directory + "/report.json", "utf8")), recovery: JSON.parse(readFileSync(directory + "/recovery-drill.json", "utf8")) }));'
          "$RUNNER_TEMP/saas-recovery-acceptance"
      - name: Retain aggregate synthetic recovery evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saas-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/saas-recovery-acceptance
          if-no-files-found: error
          retention-days: 14
