name: SaaS security acceptance

on:
  push:
    branches: ['feature/saas-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saas-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security_acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/package-lock.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Install verified Sites dependencies
        working-directory: sites
        run: npm run install:ci
      - name: Exercise synthetic authorization, isolation and recovery boundaries
        run: node scripts/run-saas-security-acceptance.mjs "$RUNNER_TEMP/saas-security-acceptance"
      - name: Retain synthetic acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: saas-security-${{ github.sha }}
          path: ${{ runner.temp }}/saas-security-acceptance
          if-no-files-found: error
          retention-days: 14
