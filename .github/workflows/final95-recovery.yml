name: Final integration recovery

on:
  push:
    branches: [main, 'integration/mgeorge-final-95']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final95-recovery-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  isolated_recovery:
    name: Isolated 430-original backup and restore acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/package-lock.json
      - name: Retain the exact checkout before verification
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/final95-recovery"
          git rev-parse HEAD | tee "$RUNNER_TEMP/final95-recovery/source-commit.txt"
          git rev-parse HEAD^{tree} | tee "$RUNNER_TEMP/final95-recovery/source-tree.txt"
      - name: Install locked dependencies with the existing integrity checks
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix sites run install:ci
      - name: Recover synthetic originals, ledger and tenant evidence
        run: |
          set -euo pipefail
          env -i PATH="$PATH" NODE_ENV=test TZ=UTC LANG=C.UTF-8 node \
            --import ./scripts/saas-test-isolation.mjs --experimental-strip-types \
            sites/scripts/recovery-drill.mjs 430 185567855 \
            | tee "$RUNNER_TEMP/final95-recovery/restore.json"
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/final95-recovery/source-commit.txt")"
          git diff --exit-code
          sha256sum "$RUNNER_TEMP/final95-recovery/restore.json" > "$RUNNER_TEMP/final95-recovery/restore.sha256"
      - name: Retain recovery evidence including incomplete results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: final95-recovery-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/final95-recovery
          if-no-files-found: error
          retention-days: 14
