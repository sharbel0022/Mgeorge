name: Payment control checks
on:
  push:
    branches: [main, 'codex/**', 'fix/**', 'feature/95-quality']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-control-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  TZ: UTC
  QUALITY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
  QUALITY_PR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22.23.4', '24.22.1']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Locked install, syntax, audits and complete synthetic suite with coverage
        run: npm run quality:node -- "$RUNNER_TEMP/quality-node"
      - name: Retain Node receipts, failure logs, JUnit and LCOV
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-node-${{ matrix.node }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-node
          if-no-files-found: error
          retention-days: 14

  sites:
    name: Sites types, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            sites/package-lock.json
            bridge/bankgiro/package-lock.json
      - name: Verified installs, types, audits, complete synthetic suite and production build
        run: npm run quality:sites -- "$RUNNER_TEMP/quality-sites"
      - name: Retain Sites receipts, failure logs, JUnit and LCOV
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-sites-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-sites
          if-no-files-found: error
          retention-days: 14

  bankgiro_bridge:
    name: Bankgiro SFTP integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: bridge/bankgiro/package-lock.json
      - name: Locked install, syntax, audits and synthetic SSH SFTP HTTP recovery
        run: npm run quality:bridge -- "$RUNNER_TEMP/quality-bridge"
      - name: Retain bridge receipts, failure logs, JUnit and LCOV
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-bridge-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-bridge
          if-no-files-found: error
          retention-days: 14

  performance:
    name: Synthetic 1, 10 and 100 company performance
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Measure real SQLite work with synthetic companies
        run: npm run quality:performance -- "$RUNNER_TEMP/quality-performance"
      - name: Retain workload, correctness and latency evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-performance-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-performance
          if-no-files-found: error
          retention-days: 14

  browser:
    name: Chromium synthetic onboarding acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: |
            sites/package-lock.json
            qa/browser/package-lock.json
      - name: Install locked browser tooling and run all synthetic UI scenarios
        run: npm run quality:browser -- "$RUNNER_TEMP/quality-browser"
      - name: Retain browser results, screenshots and source manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-browser-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/quality-browser
          if-no-files-found: error
          retention-days: 14
