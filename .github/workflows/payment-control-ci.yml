name: Payment control checks
on:
  push:
    branches: [main, 'codex/**', 'fix/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: payment-control-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Run tests with synthetic data
        run: npm test
  sites:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sites
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sites/package-lock.json
      - run: npm run install:ci
      - run: npm run check
      - name: Audit Sites production dependencies
        run: npm audit --audit-level=high
      - name: Run Sites tests with synthetic data
        run: npm test
      - run: npm run build
