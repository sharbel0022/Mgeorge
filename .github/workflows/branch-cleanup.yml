name: Archived branch cleanup

on:
  workflow_dispatch:
  push:
    branches: ['release/cleanup-approved-20261107']

permissions:
  contents: read

concurrency:
  group: mgeorge-authorized-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.repository == 'sharbel0022/Mgeorge' && github.ref == 'refs/heads/release/cleanup-approved-20261107' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.1'
      - name: Exercise isolated cleanup safety contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/branch-cleanup"
          node --test test/branch-cleanup.test.js | tee "$RUNNER_TEMP/branch-cleanup/focused-tests.tap"
      - name: Archive and process the exact manifest
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/branch-cleanup.mjs --manifest docs/cleanup/deletion-request.json --output "$RUNNER_TEMP/branch-cleanup" --execute
      - name: Preserve results and verified recovery bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: branch-cleanup-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/branch-cleanup/*.json
            ${{ runner.temp }}/branch-cleanup/*.bundle
            ${{ runner.temp }}/branch-cleanup/*.tap
          if-no-files-found: error
          retention-days: 90
